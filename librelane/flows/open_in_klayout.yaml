#
# 'name' is the registration key and the string a user types after --flow. It
# is the name the Python class carried, character for character.
#
# What did not survive the migration is the display string. OpenInKLayout and
# its four siblings were the only flows that set the class attribute 'name' to
# prose -- "Opening in KLayout" here -- and Flow.start logs it, as "Starting a
# new run of the '<name>' flow with the tag ...". A document has no field for
# it. 'name' is the registration key and 'description' below paraphrases the
# class docstring rather than that string, so the log line now reads
# "OpenInKLayout". Recorded rather than worked around, because adding a display
# field to FlowSpec is a schema change and belonged with neither the
# translation of these flows nor the deletion of the classes.
name: OpenInKLayout
description: >-
  Opens the LEF/DEF from the initial state object in the KLayout GUI. Intended
  for use with a run tag that has already been run with another flow.

jobs:
  open_gui:
    steps: [KLayout.OpenGUI]
