#
# 'name' is the registration key, which is the class name and the string a user
# types after --flow, so it survives the migration character for character. The
# class's 'name' attribute was a display string, "Opening in KLayout", and that
# becomes the description.
name: OpenInKLayout
description: >-
  Opens the LEF/DEF from the initial state object in the KLayout GUI. Intended
  for use with a run tag that has already been run with another flow.

jobs:
  open_gui:
    steps: [KLayout.OpenGUI]
