#
# The VHDLClassic flow, written as a graph of jobs.
#
# Written out in full rather than derived from classic.yaml, deliberately, and
# for the reason the VHDLClassic class it replaces gave. A flow is a
# self-contained declaration of what it runs, and a filter expression over
# another flow's list is a substitution map wearing a different hat. That is
# also why the document schema has no 'extends' key.
#
# The differences from Classic are the pinned synthesis provider and four
# omitted entries: the lint stage, Odb.SetPowerConnections,
# Odb.WriteVerilogHeader and the formal equivalence stage. None of them can run
# without Verilog sources.
name: VHDLClassic
description: >-
  A variant of Classic that accepts VHDL files for synthesis instead of Verilog
  files, and drops the Verilog linting, equivalence-checking and power-header
  steps, none of which can run without Verilog sources.

# Identical to classic.yaml's, including RUN_LINTER and RUN_EQY. The
# VHDLClassic flow this document replaces inherited both from Classic's
# configuration model, so a configuration setting either one was accepted and
# has to stay accepted. Dropping them would turn an accepted key into an
# unknown-key error. Their descriptions already say they have no effect here.
config:
  - name: RUN_TAP_ENDCAP_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.TapEndcapInsertion step.
    deprecated_names: [TAP_DECAP_INSERTION, RUN_TAP_DECAP_INSERTION]
  - name: RUN_RMP
    type: bool
    default: false
    description: >-
      Enables local resynthesis after floorplanning using the OpenROAD.RMP
      step. This is experimental and changes the netlist every later step works
      on.
  - name: RUN_POST_GPL_DESIGN_REPAIR
    type: bool
    default: true
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step.
    deprecated_names: [PL_RESIZER_DESIGN_OPTIMIZATIONS, RUN_REPAIR_DESIGN]
  - name: RUN_POST_GRT_DESIGN_REPAIR
    type: bool
    default: false
    description: >-
      Enables resizer design repair after global routing using the
      OpenROAD.RepairDesignPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
  - name: RUN_CTS
    type: bool
    default: true
    description: Enables clock tree synthesis using the OpenROAD.CTS step.
    deprecated_names: [CLOCK_TREE_SYNTH]
  - name: RUN_POST_CTS_RESIZER_TIMING
    type: bool
    default: true
    description: >-
      Enables resizer timing optimizations after clock tree synthesis using the
      OpenROAD.ResizerTimingPostCTS step.
    deprecated_names: [PL_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_POST_GRT_RESIZER_TIMING
    type: bool
    default: false
    description: >-
      Enables resizer timing optimizations after global routing using the
      OpenROAD.ResizerTimingPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
    deprecated_names: [GLB_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_HEURISTIC_DIODE_INSERTION
    type: bool
    default: false
    description: Enables the Odb.HeuristicDiodeInsertion step.
  - name: RUN_ANTENNA_REPAIR
    type: bool
    default: true
    description: Enables the OpenROAD.RepairAntennas step.
    deprecated_names: [GRT_REPAIR_ANTENNAS]
  - name: RUN_DRT
    type: bool
    default: true
    description: Enables the OpenROAD.DetailedRouting step.
  - name: RUN_FILL_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.FillInsertion step.
  - name: RUN_MCSTA
    type: bool
    default: true
    description: >-
      Enables multi-corner static timing analysis using the OpenROAD.STAPostPNR
      step.
    deprecated_names: [RUN_SPEF_STA]
  - name: RUN_SPEF_EXTRACTION
    type: bool
    default: true
    description: Enables parasitics extraction using the OpenROAD.RCX step.
  - name: RUN_IRDROP_REPORT
    type: bool
    default: true
    description: >-
      Enables generation of an IR Drop report using the OpenROAD.IRDropReport
      step.
  - name: RUN_LVS
    type: bool
    default: true
    description: Enables the Netgen.LVS step.
  - name: RUN_MAGIC_STREAMOUT
    type: bool
    default: true
    description: Enables the Magic.StreamOut step to generate GDSII.
    deprecated_names: [RUN_MAGIC]
  - name: RUN_KLAYOUT_STREAMOUT
    type: bool
    default: true
    description: Enables the KLayout.StreamOut step to generate GDSII.
    deprecated_names: [RUN_KLAYOUT]
  - name: RUN_MAGIC_WRITE_LEF
    type: bool
    default: true
    description: Enables the Magic.WriteLEF step.
    deprecated_names: [MAGIC_GENERATE_LEF]
  - name: RUN_KLAYOUT_XOR
    type: bool
    default: true
    description: >-
      Enables running the KLayout.XOR step on the two GDSII files generated by
      Magic and Klayout. Stream-outs for both KLayout and Magic should have
      already run, and the PDK must support both signoff tools.
  - name: RUN_MAGIC_DRC
    type: bool
    default: true
    description: Enables the Magic.DRC step.
  - name: RUN_KLAYOUT_DRC
    type: bool
    default: true
    description: Enables the KLayout.DRC step.
  - name: RUN_EQY
    type: bool
    default: false
    description: >-
      Enables the formal equivalence job, i.e. the Yosys.EQY step. Has no effect
      in VHDLClassic, which does not run that job.
  - name: RUN_LINTER
    type: bool
    default: true
    description: >-
      Enables the lint job, i.e. the Verilator.Lint step and associated checker
      steps. Has no effect in VHDLClassic, which does not run that job.
    deprecated_names: [RUN_VERILATOR]

# No job carries a 'source' key, for the reason classic.yaml gives: no join
# here has two branches that write the same view or metric. The one place a
# conflict would arise is the pair of stream-outs, and the comment on
# klayout_streamout says why they are not parallel.
jobs:
  # The one provider this flow pins. classic.yaml leaves synthesis bare and
  # takes the template's default, yosys; a VHDL front end is the whole reason
  # this document exists, so it names yosys_vhdl rather than relying on TOOLS.
  synthesis:
    uses: synthesis/yosys_vhdl
  pre_pnr_sta:
    needs: [synthesis]
    uses: pre_pnr_sta
  floorplan:
    needs: [pre_pnr_sta]
    uses: floorplan
  rmp:
    needs: [floorplan]
    steps: [OpenROAD.RMP]
    if: RUN_RMP
  # Straight off rmp, because Odb.SetPowerConnections sat between the two in
  # Classic and this flow omits it: it hard-requires the Verilog header only
  # Verilog synthesis emits.
  macro_placement:
    needs: [rmp]
    uses: macro_placement
  tapcell_insertion:
    needs: [macro_placement]
    uses: tapcell_insertion
    if: RUN_TAP_ENDCAP_INSERTION
  power_grid:
    needs: [tapcell_insertion]
    uses: power_grid
  io_placement:
    needs: [power_grid]
    uses: io_placement
  # Before global placement, deliberately: the port buffers exist by the time
  # placement runs, so the logic is placed around them (#917).
  add_buffer:
    needs: [io_placement]
    steps: [OpenROAD.AddBuffer]
  global_placement:
    needs: [add_buffer]
    uses: global_placement
  # classic.yaml's post_gpl_checks job, minus the step this flow cannot run.
  # Odb.WriteVerilogHeader needs the Verilog header only Verilog synthesis
  # emits; the timing snapshot is unaffected, so the job keeps its name and its
  # place.
  post_gpl_checks:
    needs: [global_placement]
    steps: [OpenROAD.STAMidPNR]
  post_gpl_repair:
    needs: [post_gpl_checks]
    uses: post_gpl_repair
    if: RUN_POST_GPL_DESIGN_REPAIR
  detailed_placement:
    needs: [post_gpl_repair]
    uses: detailed_placement
  cts:
    needs: [detailed_placement]
    uses: cts
    if: RUN_CTS
  sta_mid_pnr_2:
    needs: [cts]
    steps: [OpenROAD.STAMidPNR]
  post_cts_opt:
    needs: [sta_mid_pnr_2]
    uses: post_cts_opt
    if: RUN_POST_CTS_RESIZER_TIMING
  sta_mid_pnr_3:
    needs: [post_cts_opt]
    steps: [OpenROAD.STAMidPNR]
  global_routing:
    needs: [sta_mid_pnr_3]
    uses: global_routing
  post_grt_repair:
    needs: [global_routing]
    uses: post_grt_repair
    if: RUN_POST_GRT_DESIGN_REPAIR
  # The antenna_repair job's three steps, one job each, exactly as classic.yaml
  # splits them: the middle step carries the job's gate and its own, which is
  # the two-variable list the Python flow expanded for
  # Odb.HeuristicDiodeInsertion.
  diodes_on_ports:
    needs: [post_grt_repair]
    steps: [Odb.DiodesOnPorts]
    if: RUN_ANTENNA_REPAIR
  heuristic_diode_insertion:
    needs: [diodes_on_ports]
    steps: [Odb.HeuristicDiodeInsertion]
    if: RUN_ANTENNA_REPAIR and RUN_HEURISTIC_DIODE_INSERTION
  repair_antennas:
    needs: [heuristic_diode_insertion]
    steps: [OpenROAD.RepairAntennas]
    if: RUN_ANTENNA_REPAIR
  post_grt_opt:
    needs: [repair_antennas]
    uses: post_grt_opt
    if: RUN_POST_GRT_RESIZER_TIMING
  sta_mid_pnr_4:
    needs: [post_grt_opt]
    steps: [OpenROAD.STAMidPNR]
  detailed_routing:
    needs: [sta_mid_pnr_4]
    uses: detailed_routing
    if: RUN_DRT
  routing_reports:
    needs: [detailed_routing]
    steps:
      - Odb.ReportDisconnectedPins
      - Odb.ReportWireLength
  fill_insertion:
    needs: [routing_reports]
    uses: fill_insertion
    if: RUN_FILL_INSERTION
  cell_frequency_tables:
    needs: [fill_insertion]
    steps: [Odb.CellFrequencyTables]
  extraction:
    needs: [cell_frequency_tables]
    uses: extraction
    if: RUN_SPEF_EXTRACTION
  signoff_sta:
    needs: [extraction]
    uses: signoff_sta
    if: RUN_MCSTA
  ir_drop:
    needs: [signoff_sta]
    uses: ir_drop
    if: RUN_IRDROP_REPORT
  # One job per streamout provider. A job runs one provider, so two tools for
  # one phase is two jobs -- and that is also what makes the two independent
  # booleans expressible, since a job-level 'if' is one condition. Likewise
  # drc, below.
  magic_streamout:
    needs: [ir_drop]
    uses: streamout/magic
    if: RUN_MAGIC_STREAMOUT
  # In series with magic_streamout, and this is the one edge in the signoff
  # tail that is not relaxed, for the reason classic.yaml records: neither
  # stream-out writes the neutral 'gds' unconditionally, each writes it if its
  # own tool is PRIMARY_GDSII_STREAMOUT_TOOL or if nothing has written one yet,
  # and only in series does that reproduce "the primary tool owns 'gds'" for
  # both settings. In parallel both would write one and the join would need a
  # 'source', which names a job and so cannot say "whichever tool the PDK
  # named".
  klayout_streamout:
    needs: [magic_streamout]
    uses: streamout/klayout
    if: RUN_KLAYOUT_STREAMOUT
  # Not part of either streamout job: KLayout.Render's inputs are optional and
  # its outputs are empty, so it satisfies no part of the job's 'gds' contract
  # and carries no view across the job boundary. It is also ungated, where
  # KLayout.StreamOut is gated.
  #
  # render, write_lef and check_antenna_properties stay on the chain in flow
  # order, and the fan-out is below them rather than here, for the reason
  # classic.yaml records: every OpenROAD invocation writes
  # 'flow__warnings__count', 'flow__errors__count' and
  # 'flow__warnings__type_count' into its '-metrics' JSON, which
  # OpenROADStep.get_command and OdbpyStep.get_command pass unconditionally.
  # check_antenna_properties runs Odb.CheckDesignAntennaProperties and so
  # rewrites all three. Fanned out here, it would be one branch carrying fresh
  # counts while its siblings carried ir_drop's, and the join at final_checks
  # would raise JoinConflictError on the first real run.
  render:
    needs: [klayout_streamout]
    steps: [KLayout.Render]
  write_lef:
    needs: [render]
    steps: [Magic.WriteLEF]
    if: RUN_MAGIC_WRITE_LEF
  # Also a real data edge: Odb.CheckDesignAntennaProperties consumes 'lef', and
  # Magic.WriteLEF is the only step here that produces one.
  check_antenna_properties:
    needs: [write_lef]
    steps: [Odb.CheckDesignAntennaProperties]
  # The fan-out point: the last OpenROAD-backed job in the flow, and the four
  # jobs below it are the heavy ones. render and write_lef are cheap, so
  # keeping them on the chain costs almost nothing.
  #
  # A three-variable conjunction, because KLayout.XOR genuinely consumes
  # mag_gds from one stream-out and klayout_gds from the other and cannot run
  # unless both fired.
  xor:
    needs: [check_antenna_properties]
    steps: [KLayout.XOR]
    if: RUN_KLAYOUT_XOR and RUN_MAGIC_STREAMOUT and RUN_KLAYOUT_STREAMOUT
  magic_drc:
    needs: [check_antenna_properties]
    uses: drc/magic
    if: RUN_MAGIC_DRC
  klayout_drc:
    needs: [check_antenna_properties]
    uses: drc/klayout
    if: RUN_KLAYOUT_DRC
  lvs:
    needs: [check_antenna_properties]
    uses: lvs
    if: RUN_LVS
  # Every leaf, so that the flow has one sink, exactly as classic.yaml explains.
  # 'lvs' is named directly here where classic.yaml reaches it through
  # formal_equivalence, which this flow does not run: without that edge lvs
  # would be a second sink and its metrics would never reach
  # Misc.ReportManufacturability. render and check_antenna_properties are not
  # named because they are no longer leaves: both are ancestors of all four
  # jobs below, so their metrics arrive anyway.
  final_checks:
    needs:
      - xor
      - magic_drc
      - klayout_drc
      - lvs
    steps: [Misc.ReportManufacturability]
