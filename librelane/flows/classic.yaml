# The Classic flow, written as a graph of jobs. Place and route is a chain;
# the signoff tail fans out after check_antenna_properties and meets again at
# final_checks, the flow's single sink.
name: Classic
description: >-
  The flow most similar to the original OpenLane flow, running the Verilog RTL
  through Yosys, OpenROAD, KLayout and Magic to produce a valid GDSII for
  simpler designs. This is the default when using LibreLane via the
  command-line.

config:
  - name: RUN_TAP_ENDCAP_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.TapEndcapInsertion step.
    deprecated_names: [TAP_DECAP_INSERTION, RUN_TAP_DECAP_INSERTION]
  - name: RUN_RMP
    type: bool
    default: false
    description: >-
      Enables local resynthesis after floorplanning using the OpenROAD.RMP
      step. This is experimental and changes the netlist every later step works
      on.
  - name: RUN_POST_GPL_DESIGN_REPAIR
    type: bool
    default: true
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step.
    deprecated_names: [PL_RESIZER_DESIGN_OPTIMIZATIONS, RUN_REPAIR_DESIGN]
  - name: RUN_POST_GRT_DESIGN_REPAIR
    type: bool
    default: false
    description: >-
      Enables resizer design repair after global routing using the
      OpenROAD.RepairDesignPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
  - name: RUN_CTS
    type: bool
    default: true
    description: Enables clock tree synthesis using the OpenROAD.CTS step.
    deprecated_names: [CLOCK_TREE_SYNTH]
  - name: RUN_POST_CTS_RESIZER_TIMING
    type: bool
    default: true
    description: >-
      Enables resizer timing optimizations after clock tree synthesis using the
      OpenROAD.ResizerTimingPostCTS step.
    deprecated_names: [PL_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_POST_GRT_RESIZER_TIMING
    type: bool
    default: false
    description: >-
      Enables resizer timing optimizations after global routing using the
      OpenROAD.ResizerTimingPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
    deprecated_names: [GLB_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_HEURISTIC_DIODE_INSERTION
    type: bool
    default: false
    description: Enables the Odb.HeuristicDiodeInsertion step.
  - name: RUN_ANTENNA_REPAIR
    type: bool
    default: true
    description: Enables the OpenROAD.RepairAntennas step.
    deprecated_names: [GRT_REPAIR_ANTENNAS]
  - name: RUN_DRT
    type: bool
    default: true
    description: Enables the OpenROAD.DetailedRouting step.
  - name: RUN_FILL_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.FillInsertion step.
  - name: RUN_MCSTA
    type: bool
    default: true
    description: >-
      Enables multi-corner static timing analysis using the OpenROAD.STAPostPNR
      step.
    deprecated_names: [RUN_SPEF_STA]
  - name: RUN_SPEF_EXTRACTION
    type: bool
    default: true
    description: Enables parasitics extraction using the OpenROAD.RCX step.
  - name: RUN_IRDROP_REPORT
    type: bool
    default: true
    description: >-
      Enables generation of an IR Drop report using the OpenROAD.IRDropReport
      step.
  - name: RUN_LVS
    type: bool
    default: true
    description: Enables the Netgen.LVS step.
  - name: RUN_MAGIC_STREAMOUT
    type: bool
    default: true
    description: Enables the Magic.StreamOut step to generate GDSII.
    deprecated_names: [RUN_MAGIC]
  - name: RUN_KLAYOUT_STREAMOUT
    type: bool
    default: true
    description: Enables the KLayout.StreamOut step to generate GDSII.
    deprecated_names: [RUN_KLAYOUT]
  - name: RUN_MAGIC_WRITE_LEF
    type: bool
    default: true
    description: Enables the Magic.WriteLEF step.
    deprecated_names: [MAGIC_GENERATE_LEF]
  - name: RUN_KLAYOUT_XOR
    type: bool
    default: true
    description: >-
      Enables running the KLayout.XOR step on the two GDSII files generated by
      Magic and Klayout. Stream-outs for both KLayout and Magic should have
      already run, and the PDK must support both signoff tools.
  - name: RUN_MAGIC_DRC
    type: bool
    default: true
    description: Enables the Magic.DRC step.
  - name: RUN_KLAYOUT_DRC
    type: bool
    default: true
    description: Enables the KLayout.DRC step.
  - name: RUN_EQY
    type: bool
    default: false
    description: >-
      Enables the formal equivalence job, i.e. the Yosys.EQY step. Has no effect
      in VHDLClassic, which does not run that job.
  - name: RUN_LINTER
    type: bool
    default: true
    description: >-
      Enables the lint job, i.e. the Verilator.Lint step. Has no effect in
      VHDLClassic, which does not run that job.
    deprecated_names: [RUN_VERILATOR]

# No job needs a 'source': no join here has two branches writing the same
# view or metric. The one near-conflict, the stream-out pair, is kept in
# series (see klayout_streamout).
jobs:
  lint:
    uses: lint
    if: RUN_LINTER
  # Takes the synthesis template's default provider (yosys). A pin here would
  # only set the default; TOOLS re-points the job either way.
  synthesis:
    needs: [lint]
    uses: synthesis
  pre_pnr_sta:
    needs: [synthesis]
    uses: pre_pnr_sta
  floorplan:
    needs: [pre_pnr_sta]
    uses: floorplan
  rmp:
    needs: [floorplan]
    steps: [OpenROAD.RMP]
    if: RUN_RMP
  # Not part of the floorplan job: it requires the Verilog header only
  # Verilog synthesis emits, so vhdl_classic.yaml omits this job.
  set_power_connections:
    needs: [rmp]
    steps: [Odb.SetPowerConnections]
  macro_placement:
    needs: [set_power_connections]
    uses: macro_placement
  tapcell_insertion:
    needs: [macro_placement]
    uses: tapcell_insertion
    if: RUN_TAP_ENDCAP_INSERTION
  power_grid:
    needs: [tapcell_insertion]
    uses: power_grid
  io_placement:
    needs: [power_grid]
    uses: io_placement
  # Before global placement, so the logic is placed around the port buffers
  # (#917). Its own job because chip.yaml skips it: pad cells already buffer
  # a chip's ports.
  add_buffer:
    needs: [io_placement]
    steps: [OpenROAD.AddBuffer]
  global_placement:
    needs: [add_buffer]
    uses: global_placement
  post_gpl_checks:
    needs: [global_placement]
    steps:
      - Odb.WriteVerilogHeader
      - OpenROAD.STAMidPNR
  post_gpl_repair:
    needs: [post_gpl_checks]
    uses: post_gpl_repair
    if: RUN_POST_GPL_DESIGN_REPAIR
  detailed_placement:
    needs: [post_gpl_repair]
    uses: detailed_placement
  cts:
    needs: [detailed_placement]
    uses: cts
    if: RUN_CTS
  sta_mid_pnr_2:
    needs: [cts]
    steps: [OpenROAD.STAMidPNR]
  post_cts_opt:
    needs: [sta_mid_pnr_2]
    uses: post_cts_opt
    if: RUN_POST_CTS_RESIZER_TIMING
  sta_mid_pnr_3:
    needs: [post_cts_opt]
    steps: [OpenROAD.STAMidPNR]
  global_routing:
    needs: [sta_mid_pnr_3]
    uses: global_routing
  post_grt_repair:
    needs: [global_routing]
    uses: post_grt_repair
    if: RUN_POST_GRT_DESIGN_REPAIR
  # The antenna-repair steps as one job each, so the middle one can carry its
  # own extra gate.
  diodes_on_ports:
    needs: [post_grt_repair]
    steps: [Odb.DiodesOnPorts]
    if: RUN_ANTENNA_REPAIR
  heuristic_diode_insertion:
    needs: [diodes_on_ports]
    steps: [Odb.HeuristicDiodeInsertion]
    if: RUN_ANTENNA_REPAIR and RUN_HEURISTIC_DIODE_INSERTION
  repair_antennas:
    needs: [heuristic_diode_insertion]
    steps: [OpenROAD.RepairAntennas]
    if: RUN_ANTENNA_REPAIR
  post_grt_opt:
    needs: [repair_antennas]
    uses: post_grt_opt
    if: RUN_POST_GRT_RESIZER_TIMING
  sta_mid_pnr_4:
    needs: [post_grt_opt]
    steps: [OpenROAD.STAMidPNR]
  detailed_routing:
    needs: [sta_mid_pnr_4]
    uses: detailed_routing
    if: RUN_DRT
  routing_reports:
    needs: [detailed_routing]
    steps:
      - Odb.ReportDisconnectedPins
      - Odb.ReportWireLength
  fill_insertion:
    needs: [routing_reports]
    uses: fill_insertion
    if: RUN_FILL_INSERTION
  cell_frequency_tables:
    needs: [fill_insertion]
    steps: [Odb.CellFrequencyTables]
  extraction:
    needs: [cell_frequency_tables]
    uses: extraction
    if: RUN_SPEF_EXTRACTION
  signoff_sta:
    needs: [extraction]
    uses: signoff_sta
    if: RUN_MCSTA
  ir_drop:
    needs: [signoff_sta]
    uses: ir_drop
    if: RUN_IRDROP_REPORT
  # One job per stream-out provider: a job runs one provider, and two
  # independent gates need two 'if's. Likewise drc, below.
  magic_streamout:
    needs: [ir_drop]
    uses: streamout/magic
    if: RUN_MAGIC_STREAMOUT
  # Deliberately in series: each stream-out writes the neutral 'gds' only if
  # its tool is PRIMARY_GDSII_STREAMOUT_TOOL or nothing wrote one yet, which
  # in series reproduces "the primary tool owns 'gds'". In parallel both would
  # write it, and no static 'source' can say "whichever tool the PDK named".
  klayout_streamout:
    needs: [magic_streamout]
    uses: streamout/klayout
    if: RUN_KLAYOUT_STREAMOUT
  # render, write_lef and check_antenna_properties stay chained so the
  # fan-out below descends from ir_drop, the last Tcl-mode OpenROAD job:
  # every such invocation rewrites the undeclared flow__warnings/errors
  # framework metrics, and a branch rewriting them beside siblings that did
  # not would make the join at final_checks conflict. General rule: every
  # branch of a fan-out must descend from the last OpenROADStep-backed job.
  render:
    needs: [klayout_streamout]
    steps: [KLayout.Render]
  write_lef:
    needs: [render]
    steps: [Magic.WriteLEF]
    if: RUN_MAGIC_WRITE_LEF
  # Also a data edge: it consumes the 'lef' only Magic.WriteLEF produces.
  check_antenna_properties:
    needs: [write_lef]
    steps: [Odb.CheckDesignAntennaProperties]
  # The fan-out point. XOR consumes both stream-outs' GDS, hence the
  # three-variable gate.
  xor:
    needs: [check_antenna_properties]
    steps: [KLayout.XOR]
    if: RUN_KLAYOUT_XOR and RUN_MAGIC_STREAMOUT and RUN_KLAYOUT_STREAMOUT
  magic_drc:
    needs: [check_antenna_properties]
    uses: drc/magic
    if: RUN_MAGIC_DRC
  klayout_drc:
    needs: [check_antenna_properties]
    uses: drc/klayout
    if: RUN_KLAYOUT_DRC
  lvs:
    needs: [check_antenna_properties]
    uses: lvs
    if: RUN_LVS
  # Yosys.EQY compares the RTL against the post-place-and-route netlist, not
  # the synthesised one, so it belongs this late.
  formal_equivalence:
    needs: [lvs]
    uses: formal_equivalence
    if: RUN_EQY
  # Needs every leaf, so the flow has one sink: the manufacturability report
  # warns for each LVS/DRC/antenna metric it cannot find, and the single sink
  # is what runs/<tag>/final snapshots.
  final_checks:
    needs:
      - xor
      - magic_drc
      - klayout_drc
      - formal_equivalence
    steps: [Misc.ReportManufacturability]
