#
# The Classic flow, written as a graph of jobs.
#
# It replaces a Python class that held a flat list of steps beside a separate
# table mapping step id to gating variable. Each job below carries its own
# steps and its own 'if', so what were two declarations are one.
#
# Place and route is a chain and is written as one: each of those jobs really
# does read the view the job before it wrote. The signoff tail is not. Six
# branches leave the last stream-out together and meet again at final_checks,
# which is the flow's single sink, and the order the Python flow listed them in
# was an artefact of a list having no way to say "independent".
name: Classic
description: >-
  The flow most similar to the original OpenLane flow, running the Verilog RTL
  through Yosys, OpenROAD, KLayout and Magic to produce a valid GDSII for
  simpler designs. This is the default when using LibreLane via the
  command-line.

config:
  - name: RUN_TAP_ENDCAP_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.TapEndcapInsertion step.
    deprecated_names: [TAP_DECAP_INSERTION, RUN_TAP_DECAP_INSERTION]
  - name: RUN_RMP
    type: bool
    default: false
    description: >-
      Enables local resynthesis after floorplanning using the OpenROAD.RMP
      step. This is experimental and changes the netlist every later step works
      on.
  - name: RUN_POST_GPL_DESIGN_REPAIR
    type: bool
    default: true
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step.
    deprecated_names: [PL_RESIZER_DESIGN_OPTIMIZATIONS, RUN_REPAIR_DESIGN]
  - name: RUN_POST_GRT_DESIGN_REPAIR
    type: bool
    default: false
    description: >-
      Enables resizer design repair after global routing using the
      OpenROAD.RepairDesignPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
  - name: RUN_CTS
    type: bool
    default: true
    description: Enables clock tree synthesis using the OpenROAD.CTS step.
    deprecated_names: [CLOCK_TREE_SYNTH]
  - name: RUN_POST_CTS_RESIZER_TIMING
    type: bool
    default: true
    description: >-
      Enables resizer timing optimizations after clock tree synthesis using the
      OpenROAD.ResizerTimingPostCTS step.
    deprecated_names: [PL_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_POST_GRT_RESIZER_TIMING
    type: bool
    default: false
    description: >-
      Enables resizer timing optimizations after global routing using the
      OpenROAD.ResizerTimingPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
    deprecated_names: [GLB_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_HEURISTIC_DIODE_INSERTION
    type: bool
    default: false
    description: Enables the Odb.HeuristicDiodeInsertion step.
  - name: RUN_ANTENNA_REPAIR
    type: bool
    default: true
    description: Enables the OpenROAD.RepairAntennas step.
    deprecated_names: [GRT_REPAIR_ANTENNAS]
  - name: RUN_DRT
    type: bool
    default: true
    description: Enables the OpenROAD.DetailedRouting step.
  - name: RUN_FILL_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.FillInsertion step.
  - name: RUN_MCSTA
    type: bool
    default: true
    description: >-
      Enables multi-corner static timing analysis using the OpenROAD.STAPostPNR
      step.
    deprecated_names: [RUN_SPEF_STA]
  - name: RUN_SPEF_EXTRACTION
    type: bool
    default: true
    description: Enables parasitics extraction using the OpenROAD.RCX step.
  - name: RUN_IRDROP_REPORT
    type: bool
    default: true
    description: >-
      Enables generation of an IR Drop report using the OpenROAD.IRDropReport
      step.
  - name: RUN_LVS
    type: bool
    default: true
    description: Enables the Netgen.LVS step.
  - name: RUN_MAGIC_STREAMOUT
    type: bool
    default: true
    description: Enables the Magic.StreamOut step to generate GDSII.
    deprecated_names: [RUN_MAGIC]
  - name: RUN_KLAYOUT_STREAMOUT
    type: bool
    default: true
    description: Enables the KLayout.StreamOut step to generate GDSII.
    deprecated_names: [RUN_KLAYOUT]
  - name: RUN_MAGIC_WRITE_LEF
    type: bool
    default: true
    description: Enables the Magic.WriteLEF step.
    deprecated_names: [MAGIC_GENERATE_LEF]
  - name: RUN_KLAYOUT_XOR
    type: bool
    default: true
    description: >-
      Enables running the KLayout.XOR step on the two GDSII files generated by
      Magic and Klayout. Stream-outs for both KLayout and Magic should have
      already run, and the PDK must support both signoff tools.
  - name: RUN_MAGIC_DRC
    type: bool
    default: true
    description: Enables the Magic.DRC step.
  - name: RUN_KLAYOUT_DRC
    type: bool
    default: true
    description: Enables the KLayout.DRC step.
  - name: RUN_EQY
    type: bool
    default: false
    description: >-
      Enables the formal equivalence job, i.e. the Yosys.EQY step. Has no effect
      in VHDLClassic, which does not run that job.
  - name: RUN_LINTER
    type: bool
    default: true
    description: >-
      Enables the lint job, i.e. the Verilator.Lint step. Has no effect in
      VHDLClassic, which does not run that job.
    deprecated_names: [RUN_VERILATOR]

# No job carries a 'source' key, and that is a property of the graph rather
# than an omission: no join in this document has two branches that write the
# same view or metric, so there is nothing to tie-break. The one place a
# conflict would arise is the pair of stream-outs, and the comment on
# klayout_streamout says why they are not parallel.
jobs:
  lint:
    uses: lint
    if: RUN_LINTER
  # No provider is pinned, so this job takes the synthesis template's default,
  # yosys. Only vhdl_classic.yaml pins one, because only it needs the other.
  #
  # It is not what makes the job selectable. TOOLS re-points a job whether or
  # not its 'uses' names a provider -- a pin is this document's default, not a
  # lock -- so 'TOOLS: {synthesis: yosys_vhdl}' works here and would work just
  # the same had this said 'synthesis/yosys'. See docs/source/usage/
  # swapping_tools.md for what that particular selection then breaks.
  synthesis:
    needs: [lint]
    uses: synthesis
  pre_pnr_sta:
    needs: [synthesis]
    uses: pre_pnr_sta
  floorplan:
    needs: [pre_pnr_sta]
    uses: floorplan
  rmp:
    needs: [floorplan]
    steps: [OpenROAD.RMP]
    if: RUN_RMP
  # A plain step rather than part of the floorplan job, because it
  # hard-requires the Verilog header only Verilog synthesis emits. A flow whose
  # synthesis frontend cannot produce one omits this job.
  set_power_connections:
    needs: [rmp]
    steps: [Odb.SetPowerConnections]
  macro_placement:
    needs: [set_power_connections]
    uses: macro_placement
  tapcell_insertion:
    needs: [macro_placement]
    uses: tapcell_insertion
    if: RUN_TAP_ENDCAP_INSERTION
  power_grid:
    needs: [tapcell_insertion]
    uses: power_grid
  io_placement:
    needs: [power_grid]
    uses: io_placement
  # Before global placement, deliberately: the port buffers exist by the time
  # placement runs, so the logic is placed around them (#917).
  #
  # A job of its own rather than a member of global_placement's provider,
  # unlike the odb-editing steps folded into their neighbours: chip.yaml runs
  # global placement and deliberately does not run this, because a chip's
  # ports are the pad ring's bumps and the pad cells have buffered them
  # already. So this one really is the flow's choice.
  add_buffer:
    needs: [io_placement]
    steps: [OpenROAD.AddBuffer]
  global_placement:
    needs: [add_buffer]
    uses: global_placement
  # What the flow does once the cells have a global position: hand the netlist
  # to whatever reads a Verilog header later, and take a timing snapshot. Two
  # steps, one job, because neither is gated and no tool selection reaches
  # either.
  post_gpl_checks:
    needs: [global_placement]
    steps:
      - Odb.WriteVerilogHeader
      - OpenROAD.STAMidPNR
  post_gpl_repair:
    needs: [post_gpl_checks]
    uses: post_gpl_repair
    if: RUN_POST_GPL_DESIGN_REPAIR
  detailed_placement:
    needs: [post_gpl_repair]
    uses: detailed_placement
  cts:
    needs: [detailed_placement]
    uses: cts
    if: RUN_CTS
  sta_mid_pnr_2:
    needs: [cts]
    steps: [OpenROAD.STAMidPNR]
  post_cts_opt:
    needs: [sta_mid_pnr_2]
    uses: post_cts_opt
    if: RUN_POST_CTS_RESIZER_TIMING
  sta_mid_pnr_3:
    needs: [post_cts_opt]
    steps: [OpenROAD.STAMidPNR]
  global_routing:
    needs: [sta_mid_pnr_3]
    uses: global_routing
  post_grt_repair:
    needs: [global_routing]
    uses: post_grt_repair
    if: RUN_POST_GRT_DESIGN_REPAIR
  # The antenna_repair job's three steps, one job each. Splitting it is what
  # lets a job-level 'if' say what the gating table said: the middle step
  # carries the job's gate and its own, which is exactly the two-variable list
  # the Python flow expanded for Odb.HeuristicDiodeInsertion.
  diodes_on_ports:
    needs: [post_grt_repair]
    steps: [Odb.DiodesOnPorts]
    if: RUN_ANTENNA_REPAIR
  heuristic_diode_insertion:
    needs: [diodes_on_ports]
    steps: [Odb.HeuristicDiodeInsertion]
    if: RUN_ANTENNA_REPAIR and RUN_HEURISTIC_DIODE_INSERTION
  repair_antennas:
    needs: [heuristic_diode_insertion]
    steps: [OpenROAD.RepairAntennas]
    if: RUN_ANTENNA_REPAIR
  post_grt_opt:
    needs: [repair_antennas]
    uses: post_grt_opt
    if: RUN_POST_GRT_RESIZER_TIMING
  sta_mid_pnr_4:
    needs: [post_grt_opt]
    steps: [OpenROAD.STAMidPNR]
  detailed_routing:
    needs: [sta_mid_pnr_4]
    uses: detailed_routing
    if: RUN_DRT
  routing_reports:
    needs: [detailed_routing]
    steps:
      - Odb.ReportDisconnectedPins
      - Odb.ReportWireLength
  fill_insertion:
    needs: [routing_reports]
    uses: fill_insertion
    if: RUN_FILL_INSERTION
  cell_frequency_tables:
    needs: [fill_insertion]
    steps: [Odb.CellFrequencyTables]
  extraction:
    needs: [cell_frequency_tables]
    uses: extraction
    if: RUN_SPEF_EXTRACTION
  signoff_sta:
    needs: [extraction]
    uses: signoff_sta
    if: RUN_MCSTA
  ir_drop:
    needs: [signoff_sta]
    uses: ir_drop
    if: RUN_IRDROP_REPORT
  # One job per streamout provider. A job runs one provider, so two tools for
  # one phase is two jobs -- and that is also what makes the two independent
  # booleans expressible, since a job-level 'if' is one condition. Likewise
  # drc, below.
  magic_streamout:
    needs: [ir_drop]
    uses: streamout/magic
    if: RUN_MAGIC_STREAMOUT
  # In series with magic_streamout, and this is the one edge in the signoff
  # tail that is not relaxed. Neither stream-out writes the neutral 'gds'
  # unconditionally: each writes it if its own tool is
  # PRIMARY_GDSII_STREAMOUT_TOOL, or if nothing has written one yet. In series
  # that reproduces "the primary tool owns 'gds'" exactly, including on a
  # magic-primary PDK, which is every sky130 and gf180mcu configuration. In
  # parallel both would see an empty incoming 'gds', both would write one, and
  # the join would need a 'source' to choose. A 'source' names a job, so no
  # static entry can say "whichever tool the PDK named", and either choice
  # would silently change what the five later consumers of 'gds' read on half
  # the PDKs.
  klayout_streamout:
    needs: [magic_streamout]
    uses: streamout/klayout
    if: RUN_KLAYOUT_STREAMOUT
  # Not part of either streamout job: KLayout.Render's inputs are optional and
  # its outputs are empty, so it satisfies no part of the job's 'gds' contract
  # and carries no view across the job boundary. It is also ungated, where
  # KLayout.StreamOut is gated.
  #
  # render, write_lef and check_antenna_properties stay on the chain in flow
  # order, and the fan-out is below them rather than here. The reason is
  # framework metrics no contract declares: every OpenROAD invocation writes
  # 'flow__warnings__count', 'flow__errors__count' and
  # 'flow__warnings__type_count' into its '-metrics' JSON, which
  # OpenROADStep.get_command and OdbpyStep.get_command pass unconditionally.
  # check_antenna_properties runs Odb.CheckDesignAntennaProperties and so
  # rewrites all three. Fanned out here, it would be one branch carrying fresh
  # counts while its siblings carried ir_drop's, and the join at final_checks
  # would raise JoinConflictError on the first real run. A 'source' cannot
  # settle it either: _check_sources_can_deliver rejects a 'source' naming a
  # key no declared contract in the producer's branch mentions.
  #
  # The rule this encodes, which is not local to Classic: every branch of a
  # fan-out must descend from the last OpenROAD-backed step, so that no branch
  # writes a framework metric its siblings do not have.
  render:
    needs: [klayout_streamout]
    steps: [KLayout.Render]
  write_lef:
    needs: [render]
    steps: [Magic.WriteLEF]
    if: RUN_MAGIC_WRITE_LEF
  # Also a real data edge: Odb.CheckDesignAntennaProperties consumes 'lef', and
  # Magic.WriteLEF is the only step in Classic that produces one.
  check_antenna_properties:
    needs: [write_lef]
    steps: [Odb.CheckDesignAntennaProperties]
  # The fan-out point: the last OpenROAD-backed job in the flow, and the four
  # jobs below it are the heavy ones. render and write_lef are cheap, so
  # keeping them on the chain costs almost nothing.
  #
  # A three-variable conjunction, because KLayout.XOR genuinely consumes
  # mag_gds from one stream-out and klayout_gds from the other and cannot run
  # unless both fired.
  xor:
    needs: [check_antenna_properties]
    steps: [KLayout.XOR]
    if: RUN_KLAYOUT_XOR and RUN_MAGIC_STREAMOUT and RUN_KLAYOUT_STREAMOUT
  magic_drc:
    needs: [check_antenna_properties]
    uses: drc/magic
    if: RUN_MAGIC_DRC
  klayout_drc:
    needs: [check_antenna_properties]
    uses: drc/klayout
    if: RUN_KLAYOUT_DRC
  lvs:
    needs: [check_antenna_properties]
    uses: lvs
    if: RUN_LVS
  # An ordering edge, not a data edge, and deliberately not moved to
  # 'synthesis'. Yosys.EQY consumes 'nl', and the last writer of 'nl' before it
  # is OpenROAD.FillInsertion: it compares the RTL against the
  # post-place-and-route netlist, not the synthesised one.
  formal_equivalence:
    needs: [lvs]
    uses: formal_equivalence
    if: RUN_EQY
  # Every leaf, so that the flow has one sink. Misc.ReportManufacturability
  # reads the LVS, DRC and antenna metrics out of state_in.metrics and warns
  # for each one it cannot find, so a narrower 'needs' would turn the
  # manufacturability report into five warnings. render and
  # check_antenna_properties are not named here because they are no longer
  # leaves: both are ancestors of all four jobs below, so their metrics arrive
  # anyway. Making this the only sink also means the flow's final state is the
  # state the linear flow ended with, which is what runs/<tag>/final snapshots,
  # and it costs nothing: final_checks ran last anyway.
  final_checks:
    needs:
      - xor
      - magic_drc
      - klayout_drc
      - formal_equivalence
    steps: [Misc.ReportManufacturability]
