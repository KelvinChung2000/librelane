#
# A faithful translation of the Classic flow's Stages list and gating table.
# Every job needs exactly the job before it, reproducing the linear order the
# Python flow ran in. Relaxing those edges is a separate change, so that a
# translation error and a parallelisation error cannot arrive in one diff.
name: Classic
description: >-
  The flow most similar to the original OpenLane flow, running the Verilog RTL
  through Yosys, OpenROAD, KLayout and Magic to produce a valid GDSII for
  simpler designs. This is the default when using LibreLane via the
  command-line.

config:
  - name: RUN_TAP_ENDCAP_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.TapEndcapInsertion step.
    deprecated_names: [TAP_DECAP_INSERTION, RUN_TAP_DECAP_INSERTION]
  - name: RUN_RMP
    type: bool
    default: false
    description: >-
      Enables local resynthesis after floorplanning using the OpenROAD.RMP
      step. This is experimental and changes the netlist every later step works
      on.
  - name: RUN_POST_GPL_DESIGN_REPAIR
    type: bool
    default: true
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step.
    deprecated_names: [PL_RESIZER_DESIGN_OPTIMIZATIONS, RUN_REPAIR_DESIGN]
  - name: RUN_POST_GRT_DESIGN_REPAIR
    type: bool
    default: false
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step. This is experimental and may result in
      hangs and/or extended run times.
  - name: RUN_CTS
    type: bool
    default: true
    description: Enables clock tree synthesis using the OpenROAD.CTS step.
    deprecated_names: [CLOCK_TREE_SYNTH]
  - name: RUN_POST_CTS_RESIZER_TIMING
    type: bool
    default: true
    description: >-
      Enables resizer timing optimizations after clock tree synthesis using the
      OpenROAD.ResizerTimingPostCTS step.
    deprecated_names: [PL_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_POST_GRT_RESIZER_TIMING
    type: bool
    default: false
    description: >-
      Enables resizer timing optimizations after global routing using the
      OpenROAD.ResizerTimingPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
    deprecated_names: [GLB_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_HEURISTIC_DIODE_INSERTION
    type: bool
    default: false
    description: Enables the Odb.HeuristicDiodeInsertion step.
  - name: RUN_ANTENNA_REPAIR
    type: bool
    default: true
    description: Enables the OpenROAD.RepairAntennas step.
    deprecated_names: [GRT_REPAIR_ANTENNAS]
  - name: RUN_DRT
    type: bool
    default: true
    description: Enables the OpenROAD.DetailedRouting step.
  - name: RUN_FILL_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.FillInsertion step.
  - name: RUN_MCSTA
    type: bool
    default: true
    description: >-
      Enables multi-corner static timing analysis using the OpenROAD.STAPostPNR
      step.
    deprecated_names: [RUN_SPEF_STA]
  - name: RUN_SPEF_EXTRACTION
    type: bool
    default: true
    description: Enables parasitics extraction using the OpenROAD.RCX step.
  - name: RUN_IRDROP_REPORT
    type: bool
    default: true
    description: >-
      Enables generation of an IR Drop report using the OpenROAD.IRDropReport
      step.
  - name: RUN_LVS
    type: bool
    default: true
    description: Enables the Netgen.LVS step.
  - name: RUN_MAGIC_STREAMOUT
    type: bool
    default: true
    description: Enables the Magic.StreamOut step to generate GDSII.
    deprecated_names: [RUN_MAGIC]
  - name: RUN_KLAYOUT_STREAMOUT
    type: bool
    default: true
    description: Enables the KLayout.StreamOut step to generate GDSII.
    deprecated_names: [RUN_KLAYOUT]
  - name: RUN_MAGIC_WRITE_LEF
    type: bool
    default: true
    description: Enables the Magic.WriteLEF step.
    deprecated_names: [MAGIC_GENERATE_LEF]
  - name: RUN_KLAYOUT_XOR
    type: bool
    default: true
    description: >-
      Enables running the KLayout.XOR step on the two GDSII files generated by
      Magic and Klayout. Stream-outs for both KLayout and Magic should have
      already run, and the PDK must support both signoff tools.
  - name: RUN_MAGIC_DRC
    type: bool
    default: true
    description: Enables the Magic.DRC step.
  - name: RUN_KLAYOUT_DRC
    type: bool
    default: true
    description: Enables the KLayout.DRC step.
  - name: RUN_EQY
    type: bool
    default: false
    description: >-
      Enables the formal equivalence job, i.e. the Yosys.EQY step. Has no effect
      in VHDLClassic, which does not run that job.
  - name: RUN_LINTER
    type: bool
    default: true
    description: >-
      Enables the lint job, i.e. the Verilator.Lint step and associated checker
      steps. Has no effect in VHDLClassic, which does not run that job.
    deprecated_names: [RUN_VERILATOR]

# No job carries a 'source' key, deliberately. A 'source' entry may only name a
# direct predecessor, because the join reads only the tokens on this job's own
# input arcs; in a chain every job has exactly one, so a 'source' here could
# only restate it. Last-writer-wins is reproduced by the chain itself:
# klayout_streamout runs after magic_streamout, so its output state is the one
# every later consumer of 'gds' reads.
jobs:
  lint:
    uses: lint
    if: RUN_LINTER
  # No provider is pinned: Classic's synthesis frontend is selectable through
  # TOOLS, as it is in the Python flow. VHDLClassic is the one that pins it.
  synthesis:
    needs: [lint]
    uses: synthesis
  pre_pnr_sta:
    needs: [synthesis]
    uses: pre_pnr_sta
  floorplan:
    needs: [pre_pnr_sta]
    uses: floorplan
  rmp:
    needs: [floorplan]
    steps: [OpenROAD.RMP]
    if: RUN_RMP
  # A plain step rather than part of the floorplan job, because it
  # hard-requires the Verilog header only Verilog synthesis emits. A flow whose
  # synthesis frontend cannot produce one omits this job.
  set_power_connections:
    needs: [rmp]
    steps: [Odb.SetPowerConnections]
  macro_placement:
    needs: [set_power_connections]
    uses: macro_placement
  cut_rows:
    needs: [macro_placement]
    steps: [OpenROAD.CutRows]
  tapcell_insertion:
    needs: [cut_rows]
    uses: tapcell_insertion
    if: RUN_TAP_ENDCAP_INSERTION
  power_grid:
    needs: [tapcell_insertion]
    uses: power_grid
  add_routing_obstructions:
    needs: [power_grid]
    steps: [Odb.AddRoutingObstructions]
  io_placement:
    needs: [add_routing_obstructions]
    uses: io_placement
  # Before global placement, deliberately: the port buffers exist by the time
  # placement runs, so the logic is placed around them (#917).
  add_buffer:
    needs: [io_placement]
    steps: [OpenROAD.AddBuffer]
  global_placement:
    needs: [add_buffer]
    uses: global_placement
  write_verilog_header:
    needs: [global_placement]
    steps: [Odb.WriteVerilogHeader, Checker.PowerGridViolations]
  sta_mid_pnr_1:
    needs: [write_verilog_header]
    steps: [OpenROAD.STAMidPNR]
  post_gpl_repair:
    needs: [sta_mid_pnr_1]
    uses: post_gpl_repair
    if: RUN_POST_GPL_DESIGN_REPAIR
  manual_global_placement:
    needs: [post_gpl_repair]
    steps: [Odb.ManualGlobalPlacement]
  detailed_placement:
    needs: [manual_global_placement]
    uses: detailed_placement
  cts:
    needs: [detailed_placement]
    uses: cts
    if: RUN_CTS
  sta_mid_pnr_2:
    needs: [cts]
    steps: [OpenROAD.STAMidPNR]
  post_cts_opt:
    needs: [sta_mid_pnr_2]
    uses: post_cts_opt
    if: RUN_POST_CTS_RESIZER_TIMING
  sta_mid_pnr_3:
    needs: [post_cts_opt]
    steps: [OpenROAD.STAMidPNR]
  global_routing:
    needs: [sta_mid_pnr_3]
    uses: global_routing
  post_grt_repair:
    needs: [global_routing]
    uses: post_grt_repair
    if: RUN_POST_GRT_DESIGN_REPAIR
  # The antenna_repair job's three steps, one job each. Splitting it is what
  # lets a job-level 'if' say what the gating table said: the middle step
  # carries the job's gate and its own, which is exactly the two-variable list
  # the Python flow expanded for Odb.HeuristicDiodeInsertion.
  diodes_on_ports:
    needs: [post_grt_repair]
    steps: [Odb.DiodesOnPorts]
    if: RUN_ANTENNA_REPAIR
  heuristic_diode_insertion:
    needs: [diodes_on_ports]
    steps: [Odb.HeuristicDiodeInsertion]
    if: RUN_ANTENNA_REPAIR and RUN_HEURISTIC_DIODE_INSERTION
  repair_antennas:
    needs: [heuristic_diode_insertion]
    steps: [OpenROAD.RepairAntennas]
    if: RUN_ANTENNA_REPAIR
  post_grt_opt:
    needs: [repair_antennas]
    uses: post_grt_opt
    if: RUN_POST_GRT_RESIZER_TIMING
  sta_mid_pnr_4:
    needs: [post_grt_opt]
    steps: [OpenROAD.STAMidPNR]
  detailed_routing:
    needs: [sta_mid_pnr_4]
    uses: detailed_routing
    if: RUN_DRT
  routing_reports:
    needs: [detailed_routing]
    steps:
      - Odb.ReportDisconnectedPins
      - Checker.DisconnectedPins
      - Odb.ReportWireLength
      - Checker.WireLength
  fill_insertion:
    needs: [routing_reports]
    uses: fill_insertion
    if: RUN_FILL_INSERTION
  cell_frequency_tables:
    needs: [fill_insertion]
    steps: [Odb.CellFrequencyTables]
  extraction:
    needs: [cell_frequency_tables]
    uses: extraction
    if: RUN_SPEF_EXTRACTION
  signoff_sta:
    needs: [extraction]
    uses: signoff_sta
    if: RUN_MCSTA
  ir_drop:
    needs: [signoff_sta]
    uses: ir_drop
    if: RUN_IRDROP_REPORT
  # One job per streamout provider rather than one multi-provider job, because
  # the two are switched by two independent booleans and a job-level 'if' is
  # one condition. Likewise drc, below.
  magic_streamout:
    needs: [ir_drop]
    uses: streamout/magic
    if: RUN_MAGIC_STREAMOUT
  klayout_streamout:
    needs: [magic_streamout]
    uses: streamout/klayout
    if: RUN_KLAYOUT_STREAMOUT
  # Not part of either streamout job: KLayout.Render's inputs are optional and
  # its outputs are empty, so it satisfies no part of the job's 'gds' contract
  # and carries no view across the job boundary. It is also ungated, where
  # KLayout.StreamOut is gated.
  render:
    needs: [klayout_streamout]
    steps: [KLayout.Render]
  write_lef:
    needs: [render]
    steps: [Magic.WriteLEF]
    if: RUN_MAGIC_WRITE_LEF
  check_antenna_properties:
    needs: [write_lef]
    steps: [Odb.CheckDesignAntennaProperties]
  # A three-variable conjunction, because KLayout.XOR genuinely consumes
  # mag_gds from one stream-out and klayout_gds from the other and cannot run
  # unless both fired.
  xor:
    needs: [check_antenna_properties]
    steps: [KLayout.XOR, Checker.XOR]
    if: RUN_KLAYOUT_XOR and RUN_MAGIC_STREAMOUT and RUN_KLAYOUT_STREAMOUT
  magic_drc:
    needs: [xor]
    uses: drc/magic
    if: RUN_MAGIC_DRC
  klayout_drc:
    needs: [magic_drc]
    uses: drc/klayout
    if: RUN_KLAYOUT_DRC
  lvs:
    needs: [klayout_drc]
    uses: lvs
    if: RUN_LVS
  formal_equivalence:
    needs: [lvs]
    uses: formal_equivalence
    if: RUN_EQY
  final_checks:
    needs: [formal_equivalence]
    steps:
      - Checker.SetupViolations
      - Checker.HoldViolations
      - Checker.MaxSlewViolations
      - Checker.MaxCapViolations
      - Misc.ReportManufacturability
