#
# The Chip flow's Stages list and gating table, as a graph.
#
# Written out in full rather than derived from classic.yaml, for the reason
# given on VHDLClassic.Stages and repeated in vhdl_classic.yaml.
#
# The differences from Classic are OpenROAD.PadRing after
# Odb.SetPowerConnections, the six chip finishing steps after Checker.XOR, and
# three omissions: Magic.WriteLEF and Odb.CheckDesignAntennaProperties, which a
# chip does not need because it is not a macro, and the io_placement job, whose
# pins are the pad ring's bumps. Chip also runs neither OpenROAD.RMP nor
# OpenROAD.AddBuffer, both of which Classic runs.
name: Chip
description: >-
  A flow used to implement complete chip designs. This includes pad ring
  generation, seal ring generation, filler insertion, and density check.

# Identical to classic.yaml's, because Chip inherits Classic.Config: every one
# of these is an accepted configuration key today and has to stay accepted.
# That includes RUN_RMP and RUN_MAGIC_WRITE_LEF, which gate nothing here because
# Chip declares its own Stages with neither OpenROAD.RMP nor Magic.WriteLEF in
# it. Declaring the variable is what keeps an existing configuration loading;
# adding the job would make this document run something the flow does not.
config:
  - name: RUN_TAP_ENDCAP_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.TapEndcapInsertion step.
    deprecated_names: [TAP_DECAP_INSERTION, RUN_TAP_DECAP_INSERTION]
  - name: RUN_RMP
    type: bool
    default: false
    description: >-
      Enables local resynthesis after floorplanning using the OpenROAD.RMP
      step. This is experimental and changes the netlist every later step works
      on.
  - name: RUN_POST_GPL_DESIGN_REPAIR
    type: bool
    default: true
    description: >-
      Enables resizer design repair after global placement using the
      OpenROAD.RepairDesignPostGPL step.
    deprecated_names: [PL_RESIZER_DESIGN_OPTIMIZATIONS, RUN_REPAIR_DESIGN]
  - name: RUN_POST_GRT_DESIGN_REPAIR
    type: bool
    default: false
    description: >-
      Enables resizer design repair after global routing using the
      OpenROAD.RepairDesignPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
  - name: RUN_CTS
    type: bool
    default: true
    description: Enables clock tree synthesis using the OpenROAD.CTS step.
    deprecated_names: [CLOCK_TREE_SYNTH]
  - name: RUN_POST_CTS_RESIZER_TIMING
    type: bool
    default: true
    description: >-
      Enables resizer timing optimizations after clock tree synthesis using the
      OpenROAD.ResizerTimingPostCTS step.
    deprecated_names: [PL_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_POST_GRT_RESIZER_TIMING
    type: bool
    default: false
    description: >-
      Enables resizer timing optimizations after global routing using the
      OpenROAD.ResizerTimingPostGRT step. This is experimental and may result in
      hangs and/or extended run times.
    deprecated_names: [GLB_RESIZER_TIMING_OPTIMIZATIONS]
  - name: RUN_HEURISTIC_DIODE_INSERTION
    type: bool
    default: false
    description: Enables the Odb.HeuristicDiodeInsertion step.
  - name: RUN_ANTENNA_REPAIR
    type: bool
    default: true
    description: Enables the OpenROAD.RepairAntennas step.
    deprecated_names: [GRT_REPAIR_ANTENNAS]
  - name: RUN_DRT
    type: bool
    default: true
    description: Enables the OpenROAD.DetailedRouting step.
  - name: RUN_FILL_INSERTION
    type: bool
    default: true
    description: Enables the OpenROAD.FillInsertion step.
  - name: RUN_MCSTA
    type: bool
    default: true
    description: >-
      Enables multi-corner static timing analysis using the OpenROAD.STAPostPNR
      step.
    deprecated_names: [RUN_SPEF_STA]
  - name: RUN_SPEF_EXTRACTION
    type: bool
    default: true
    description: Enables parasitics extraction using the OpenROAD.RCX step.
  - name: RUN_IRDROP_REPORT
    type: bool
    default: true
    description: >-
      Enables generation of an IR Drop report using the OpenROAD.IRDropReport
      step.
  - name: RUN_LVS
    type: bool
    default: true
    description: Enables the Netgen.LVS step.
  - name: RUN_MAGIC_STREAMOUT
    type: bool
    default: true
    description: Enables the Magic.StreamOut step to generate GDSII.
    deprecated_names: [RUN_MAGIC]
  - name: RUN_KLAYOUT_STREAMOUT
    type: bool
    default: true
    description: Enables the KLayout.StreamOut step to generate GDSII.
    deprecated_names: [RUN_KLAYOUT]
  - name: RUN_MAGIC_WRITE_LEF
    type: bool
    default: true
    description: Enables the Magic.WriteLEF step.
    deprecated_names: [MAGIC_GENERATE_LEF]
  - name: RUN_KLAYOUT_XOR
    type: bool
    default: true
    description: >-
      Enables running the KLayout.XOR step on the two GDSII files generated by
      Magic and Klayout. Stream-outs for both KLayout and Magic should have
      already run, and the PDK must support both signoff tools.
  - name: RUN_MAGIC_DRC
    type: bool
    default: true
    description: Enables the Magic.DRC step.
  - name: RUN_KLAYOUT_DRC
    type: bool
    default: true
    description: Enables the KLayout.DRC step.
  - name: RUN_EQY
    type: bool
    default: false
    description: >-
      Enables the formal equivalence job, i.e. the Yosys.EQY step. Has no effect
      in VHDLClassic, which does not run that job.
  - name: RUN_LINTER
    type: bool
    default: true
    description: >-
      Enables the lint job, i.e. the Verilator.Lint step and associated checker
      steps. Has no effect in VHDLClassic, which does not run that job.
    deprecated_names: [RUN_VERILATOR]

# No job carries a 'source' key. Chip has a third writer of 'gds' that Classic
# does not, chip_finishing, but it descends from both stream-outs rather than
# racing them, so there is still no join whose branches write the same view.
jobs:
  lint:
    uses: lint
    if: RUN_LINTER
  # No provider pinned, mirroring Chip.Stages' bare Job.synthesis.
  synthesis:
    needs: [lint]
    uses: synthesis
  pre_pnr_sta:
    needs: [synthesis]
    uses: pre_pnr_sta
  floorplan:
    needs: [pre_pnr_sta]
    uses: floorplan
  # Straight off the floorplan: Chip runs no OpenROAD.RMP, which is where
  # classic.yaml puts the rmp job.
  set_power_connections:
    needs: [floorplan]
    steps: [Odb.SetPowerConnections]
  pad_ring:
    needs: [set_power_connections]
    steps: [OpenROAD.PadRing]
  macro_placement:
    needs: [pad_ring]
    uses: macro_placement
  cut_rows:
    needs: [macro_placement]
    steps: [OpenROAD.CutRows]
  tapcell_insertion:
    needs: [cut_rows]
    uses: tapcell_insertion
    if: RUN_TAP_ENDCAP_INSERTION
  power_grid:
    needs: [tapcell_insertion]
    uses: power_grid
  add_routing_obstructions:
    needs: [power_grid]
    steps: [Odb.AddRoutingObstructions]
  # The io_placement job is omitted. The two steps of it a chip still needs are
  # listed inline: OpenROAD.GlobalPlacementSkipIO seeds placement before the
  # pins exist, and Odb.ApplyDEFTemplate copies a pin arrangement from a
  # template. Neither places a pin, so this flow has no io_placement boundary
  # and cannot swap that job's tool from TOOLS. chip.py:44-51 records why.
  #
  # No add_buffer job follows, because Chip runs no OpenROAD.AddBuffer either:
  # a chip's ports are the pad ring's bumps and are already buffered by pad
  # cells.
  placement_seed:
    needs: [add_routing_obstructions]
    steps: [OpenROAD.GlobalPlacementSkipIO, Odb.ApplyDEFTemplate]
  global_placement:
    needs: [placement_seed]
    uses: global_placement
  write_verilog_header:
    needs: [global_placement]
    steps: [Odb.WriteVerilogHeader, Checker.PowerGridViolations]
  sta_mid_pnr_1:
    needs: [write_verilog_header]
    steps: [OpenROAD.STAMidPNR]
  post_gpl_repair:
    needs: [sta_mid_pnr_1]
    uses: post_gpl_repair
    if: RUN_POST_GPL_DESIGN_REPAIR
  manual_global_placement:
    needs: [post_gpl_repair]
    steps: [Odb.ManualGlobalPlacement]
  detailed_placement:
    needs: [manual_global_placement]
    uses: detailed_placement
  cts:
    needs: [detailed_placement]
    uses: cts
    if: RUN_CTS
  sta_mid_pnr_2:
    needs: [cts]
    steps: [OpenROAD.STAMidPNR]
  post_cts_opt:
    needs: [sta_mid_pnr_2]
    uses: post_cts_opt
    if: RUN_POST_CTS_RESIZER_TIMING
  sta_mid_pnr_3:
    needs: [post_cts_opt]
    steps: [OpenROAD.STAMidPNR]
  global_routing:
    needs: [sta_mid_pnr_3]
    uses: global_routing
  post_grt_repair:
    needs: [global_routing]
    uses: post_grt_repair
    if: RUN_POST_GRT_DESIGN_REPAIR
  # The antenna_repair job's three steps, one job each, exactly as classic.yaml
  # splits them.
  diodes_on_ports:
    needs: [post_grt_repair]
    steps: [Odb.DiodesOnPorts]
    if: RUN_ANTENNA_REPAIR
  heuristic_diode_insertion:
    needs: [diodes_on_ports]
    steps: [Odb.HeuristicDiodeInsertion]
    if: RUN_ANTENNA_REPAIR and RUN_HEURISTIC_DIODE_INSERTION
  repair_antennas:
    needs: [heuristic_diode_insertion]
    steps: [OpenROAD.RepairAntennas]
    if: RUN_ANTENNA_REPAIR
  post_grt_opt:
    needs: [repair_antennas]
    uses: post_grt_opt
    if: RUN_POST_GRT_RESIZER_TIMING
  sta_mid_pnr_4:
    needs: [post_grt_opt]
    steps: [OpenROAD.STAMidPNR]
  detailed_routing:
    needs: [sta_mid_pnr_4]
    uses: detailed_routing
    if: RUN_DRT
  routing_reports:
    needs: [detailed_routing]
    steps:
      - Odb.ReportDisconnectedPins
      - Checker.DisconnectedPins
      - Odb.ReportWireLength
      - Checker.WireLength
  fill_insertion:
    needs: [routing_reports]
    uses: fill_insertion
    if: RUN_FILL_INSERTION
  cell_frequency_tables:
    needs: [fill_insertion]
    steps: [Odb.CellFrequencyTables]
  extraction:
    needs: [cell_frequency_tables]
    uses: extraction
    if: RUN_SPEF_EXTRACTION
  signoff_sta:
    needs: [extraction]
    uses: signoff_sta
    if: RUN_MCSTA
  ir_drop:
    needs: [signoff_sta]
    uses: ir_drop
    if: RUN_IRDROP_REPORT
  # One job per streamout provider rather than one multi-provider job, because
  # the two are switched by two independent booleans and a job-level 'if' is
  # one condition. Likewise drc, below.
  magic_streamout:
    needs: [ir_drop]
    uses: streamout/magic
    if: RUN_MAGIC_STREAMOUT
  # In series with magic_streamout, for the reason classic.yaml records:
  # neither stream-out writes the neutral 'gds' unconditionally, each writes it
  # if its own tool is PRIMARY_GDSII_STREAMOUT_TOOL or if nothing has written
  # one yet, and only in series does that reproduce "the primary tool owns
  # 'gds'" for both settings. In parallel both would write one and the join
  # would need a 'source', which names a job and so cannot say "whichever tool
  # the PDK named".
  klayout_streamout:
    needs: [magic_streamout]
    uses: streamout/klayout
    if: RUN_KLAYOUT_STREAMOUT
  # Not part of either streamout job: KLayout.Render's inputs are optional and
  # its outputs are empty, so it satisfies no part of the job's 'gds' contract
  # and carries no view across the job boundary. It is also ungated, where
  # KLayout.StreamOut is gated.
  render:
    needs: [klayout_streamout]
    steps: [KLayout.Render]
  # A three-variable conjunction, because KLayout.XOR genuinely consumes
  # mag_gds from one stream-out and klayout_gds from the other and cannot run
  # unless both fired.
  #
  # In series after render and before chip_finishing, which is Chip.Stages'
  # real order (Render, XOR, Checker.XOR, then the six finishing steps) and is
  # not a relaxation this document may make. chip_finishing rewrites 'gds';
  # render and xor read the stream-out's. Run in parallel, the branches reach
  # final_checks holding two different 'gds' values and join_states raises
  # JoinConflictError -- it compares values, not declarations, so a key written
  # in the shared prefix and rewritten on exactly one branch is a conflict.
  # _check_fan_in_is_unambiguous cannot see it, because it subtracts the shared
  # ancestors before intersecting.
  xor:
    needs: [render]
    steps: [KLayout.XOR, Checker.XOR]
    if: RUN_KLAYOUT_XOR and RUN_MAGIC_STREAMOUT and RUN_KLAYOUT_STREAMOUT
  # The six finishing steps, as one job, because two of them rewrite 'gds' in
  # place: KLayout.SealRing and KLayout.Filler each consume it and produce it.
  # Keeping them together makes this job the single last writer of 'gds', which
  # is what lets the three signoff jobs below take it from here with no
  # 'source' to tie-break. All six are ungated today.
  chip_finishing:
    needs: [xor]
    steps:
      - KLayout.Antenna
      - Checker.KLayoutAntenna
      - KLayout.SealRing
      - KLayout.Filler
      - KLayout.Density
      - Checker.KLayoutDensity
  # The one place Chip's signoff differs from Classic's in shape: these three
  # hang off chip_finishing rather than off the last stream-out, because
  # Magic.DRC, KLayout.DRC and Magic.SpiceExtraction all consume 'gds' and ran
  # after the seal ring and filler in Chip.Stages. They read the finished
  # layout, not the raw stream-out.
  magic_drc:
    needs: [chip_finishing]
    uses: drc/magic
    if: RUN_MAGIC_DRC
  klayout_drc:
    needs: [chip_finishing]
    uses: drc/klayout
    if: RUN_KLAYOUT_DRC
  lvs:
    needs: [chip_finishing]
    uses: lvs
    if: RUN_LVS
  # An ordering edge, not a data edge, and deliberately not moved to
  # 'synthesis'. Yosys.EQY consumes 'nl', and the last writer of 'nl' before it
  # is OpenROAD.FillInsertion: it compares the RTL against the
  # post-place-and-route netlist, not the synthesised one.
  formal_equivalence:
    needs: [lvs]
    uses: formal_equivalence
    if: RUN_EQY
  # Every leaf, so that the flow has one sink, for the reason classic.yaml
  # gives: Misc.ReportManufacturability reads the LVS, DRC and antenna metrics
  # out of state_in.metrics and warns for each one it cannot find. render and
  # xor are not named because they are no longer leaves: both are ancestors of
  # chip_finishing and so of all three branches below, and their metrics arrive
  # anyway.
  final_checks:
    needs:
      - magic_drc
      - klayout_drc
      - formal_equivalence
    steps:
      - Checker.SetupViolations
      - Checker.HoldViolations
      - Checker.MaxSlewViolations
      - Checker.MaxCapViolations
      - Misc.ReportManufacturability
