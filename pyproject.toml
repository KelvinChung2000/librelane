[project]
name = "librelane"
version = "3.0.5"
description = "An infrastructure for implementing chip design flows"
maintainers = [
    {name = "Mohamed Gaber", email = "donn@fossi-foundation.org"},
    {name = "Leo Moser", email = "leo@fossi-foundation.org"}
]
readme = "Readme.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "click>=8,<8.3",
  "cloup>=3.0.5,<4",
  "pyyaml>=5,<7",
  "rich>=12,<16",
  "ciel>=2.3.1,<3",
  "lxml>=4.9.0,<7",
  "loguru>=0.7,<1",
  "deprecated>=1.2.10,<2",
  "lln-libparse==0.56.*",
  "psutil>=5.9.0,<8",
  "httpx>=0.22.0,<0.29",
  "klayout>=0.29.0,<0.32.0",
  "lark>=1.3,<2",
  "pydantic>=2.13.4,<3",
  "rapidfuzz>=3.9.0,<4",
  "yamlcore>=0.0.2,<0.1.0",
  "semver>=3.0.2,<4"
]

[project.urls]
homepage = "https://librelane.org/"
repository = "https://github.com/librelane/librelane"
documentation = "https://librelane.readthedocs.io"
"Bug Tracker" = "https://github.com/librelane/librelane/issues"

[dependency-groups]

lint = [
    "ruff",
    "mypy>=1.18.2",
    "lxml-stubs",
    "types-PyYAML",
    "types-Deprecated",
    "types-psutil",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pyfakefs",
    "pillow"
]
docs = [
    "furo>=2024.8.6",
    "docutils>=0.17,<1",
    "sphinx>=7.2.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-design>=0.5.0,<1",
    "myst-parser>=2.0.0,<5",
    "docstring-parser>=0.15,<1",
    "sphinx-tippy>=0.4.1,<1",
    "sphinx-copybutton>=0.5.2,<1",
    "sphinxcontrib-spelling>=8.0.0,<9",
    "sphinxcontrib-bibtex>=2.6.0,<3",
    "sphinx-subfigure>=0.2.4,<1",
]

[project.scripts]
librelane = "librelane.__main__:cli"
"librelane.steps" = "librelane.steps.__main__:cli"
"librelane.config" = "librelane.config.__main__:cli"
"librelane.state" = "librelane.state.__main__:cli"
"librelane.help" = "librelane.help.__main__:cli"
"librelane.env_info" = "librelane:env_info_cli"

[tool.ruff]
target-version = "py310"
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "PT"]
ignore = [
  # Formatting is the formatter's job, and .flake8 waived E5/E1/E2/E3 historically.
  "E501",  # line-too-long
  "E731",  # lambda-assignment: 3 deliberate uses
  "E721",  # type-comparison: 2 deliberate uses
  "PT001",  # preserve the existing parentheses convention for fixtures
  "W291", "W293",  # trailing whitespace: formatter's job
]

[tool.ruff.lint.per-file-ignores]
# Re-exports. Mirrors .flake8's `*/__init__.py:F401`.
"**/__init__.py" = ["F401"]

[tool.ruff.format]
# Match the existing black-formatted style.
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = "."
# step_impl_test is deselected by default: those tests shell out to
# OpenROAD/Magic/Netgen/Yosys, which only exist inside the Nix closure.
# They run in the build-linux-*/build-darwin jobs. Do not remove this
# exclusion to "increase coverage" -- it breaks every non-Nix runner.
addopts = "--strict-markers -m 'not step_impl_test'"
markers = [
    "all: all tests",
    "step_impl_test: tests for specific step implementations (requires recursive git clone + more time)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["librelane"]

[tool.hatch.build.targets.sdist]
include = [
  "librelane/",
  "test/",
  "Readme.md",
  "License",
  "Changelog.md",
]
