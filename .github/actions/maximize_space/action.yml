name: Maximize Build Space
description: Frees runner disk space by removing unused preinstalled toolchains.
runs:
  using: composite
  steps:
    - uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
      with:
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"
        remove-docker-images: "true"
